            <script>
                 document.getElementById("serviceForm").addEventListener("submit", function (e) {
        e.preventDefault();

        // Generate unique code: REQ-YYYYMMDD-XYZ123
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const dateCode = `${yyyy}${mm}${dd}`;

        const randomSuffix = Math.random().toString(36).substr(2, 6).toUpperCase();
        const requestCode = `REQ-${dateCode}-${randomSuffix}`;

        // Collect form data
        const name = document.getElementById("description").value;
        const email = document.getElementById("email").value;
        const address = document.getElementById("address").value;
        const cell = document.getElementById("cell").value;
        const service = document.getElementById("Srequest").value;
        const serviceDate = document.getElementById("serviceDate").value;

        // Format content for file
        const content = `Request Code: ${requestCode}
Name: ${name}
Email: ${email}
Address: ${address}
Cell: ${cell}
Service Requested: ${service}
Preferred Service Date: ${serviceDate}
`;

        // Create and download the file
        const blob = new Blob([content], { type: "text/plain" });
        const link = document.createElement("a");
        link.download = `serviceRequest-${requestCode}.txt`;
        link.href = URL.createObjectURL(blob);
        link.click();

        // Redirect to thank you page
        setTimeout(() => {
            window.location.href = "thankyou.html";
        }, 1000);
    });
            </script>
</div>
