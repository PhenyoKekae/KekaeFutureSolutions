<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Thank You - Future Solutions</title>
    <link rel="stylesheet" href="~/css/form.css" asp-append-version="true" />
    <link rel="stylesheet" href="~/css/index.css" asp-append-version="true" />
    <link rel="stylesheet" href="~/css/index.css" asp-append-version="true" />
    <link href='https://fonts.googleapis.com/css?family=Darker Grotesque' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Alumni Sans Pinstripe' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #24791c, #3ea05d, #fff);
            font-family: 'Inter', sans-serif;
            color: #ffffff;
        }

        .thankyou-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 0 20px;
            animation: fadeIn 1.2s ease-in;
        }




        .thankyou-container a {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 28px;
            background-color: #ffffff;
            color: #2e7f13;
            
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.3s ease, color 0.3s ease;
            font-family: 'Darker Grotesque';font-size: 15px;
        }

        .thankyou-container a:hover {
            background-color: #5ab976;
            color: #ffffff;
        }
        h1
        {
            font-family: 'Darker Grotesque';font-size: 25px;
            color: grey;
        }
        p
        {
           font-family: 'Darker Grotesque';font-size: 17px;
           text-align: center;          
        }  
        li
        {
            font-family: 'Darker Grotesque';font-size: 15px;
        }    
        span
        {
            font-family: 'Darker Grotesque';font-size: 22px;
        }
    </style>
</head>
<script src="JScripts/main.js" type="text/javascript"></script>

<body>
    <div class="thankyou-container">
        <h1>Thank You!</h1>
        <p>Your service booking has been successfully received.</p>
        <p>A confirmation email with all the details has been sent to your inbox.</p>
        <p>We’ll be in touch soon to finalize your request.</p>
        <a href="Index.html">← Back to Home</a>
    </div>
</body>
</html>
